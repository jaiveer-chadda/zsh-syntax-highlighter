## @file syntaxes/zsh.tmLanguage.yaml

$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json

# ——————————————————————————————————————————————————————————————————————————————————————————————————————————————————— #

# All Fields
# ‾‾‾‾‾‾‾‾‾‾
# name                : string    // the name which gets assigned to the portion matched. This is used for styling and scope-specific settings and actions, which means it should generally be derived from one of the standard names.
# contentName         : string    // this key is similar to the name key but only assigns the name to the text between what is matched by the begin/end patterns.
# disabled            : int-bool  // set this property to 1 to disable the current pattern
#
# comment             : string    // just a comment - nothing special about it
#
# match               : string    // a regular expression which is used to identify the portion of text to which the name should be assigned. Example: '\b(true|false)\b'.
# captures            : object    // allows you to assign attributes to the captures of the match pattern. Using the captures key for a begin/end rule is short-hand for giving both beginCaptures and endCaptures with same values.
#
# begin               : string    // these keys allow matches which span several lines and must both be mutually exclusive with the match key. Each is a regular expression pattern. begin is the pattern that starts the block and end is the pattern which ends the block. Captures from the begin pattern can be referenced in the end pattern by using normal regular expression back-references. This is often used with here-docs. A begin/end rule can have nested patterns using the patterns key.
# end                 : string    // these keys allow matches which span several lines and must both be mutually exclusive with the match key. Each is a regular expression pattern. begin is the pattern that starts the block and end is the pattern which ends the block. Captures from the begin pattern can be referenced in the end pattern by using normal regular expression back-references. This is often used with here-docs. A begin/end rule can have nested patterns using the patterns key.
# while               : string    // these keys allow matches which span several lines and must both be mutually exclusive with the match key. Each is a regular expression pattern. begin is the pattern that starts the block and while continues it.
#
# beginCaptures       : object    // allows you to assign attributes to the captures of the begin pattern. Using the captures key for a begin/end   rule is short-hand for giving both beginCaptures and endCaptures   with same values.
# endCaptures         : object    // allows you to assign attributes to the captures of the end   pattern. Using the captures key for a begin/end   rule is short-hand for giving both beginCaptures and endCaptures   with same values.
# whileCaptures       : object    // allows you to assign attributes to the captures of the while pattern. Using the captures key for a begin/while rule is short-hand for giving both beginCaptures and whileCaptures with same values.
#
# patterns            : array     // applies to the region between the begin and end matches
#
# applyEndPatternLast : int-bool
# include             : string    // this allows you to reference a different language, recursively reference the grammar itself or a rule declared in this file’s repository.

# ——————————————————————————————————————————————————————————————————————————————————————————————————————————————————— #

name: zsh
scopeName: source.zsh

# ——————————————————————————————————————————————————————————————————————————————————————————————————————————————————— #

patterns:
  - include: '#shebang'
  - include: '#statement'

repository:

  # yaml-embedded-languages: regex

  # —— shebang —————————————————————————————————————————————————————————————————————————————————————————————————————— #

  shebang:
    name: meta.shebang.zsh
    match: |-
      (?x)
      ^([#]!)[ \t]*([^ \t]*)[ \t]*(.*)$

    captures:
      '1': { name: punctuation.definition.comment.shebang.zsh }
      '2': { name: meta.shebang.interpreter.zsh               }
      '3': { name: meta.shebang.args.zsh                      }

  # —— [statement] —————————————————————————————————————————————————————————————————————————————————————————————————— #

  statement:
    patterns:
      - include: '#comment'
      - include: '#builtin'
      - include: '#function'
      - include: '#semicolon'
      - include: '#closing_brace'

  # ————————————————————————————————————————————————————————————————————————————————————————————————————————————————— #
  # —— comment —————————————————————————————————————————————————————————————————————————————————————————————————————— #

  comment:
    name: comment.line.zsh
    match: |-
      (?<=^|[ \t])(#).*$

    captures: { '1': { name: punctuation.definition.comment.zsh } }

  # —— semicolon ———————————————————————————————————————————————————————————————————————————————————————————————————— #

  semicolon:
    name: punctuation.terminator.semicolon.zsh
    match: ;

  # —— closing_brace ———————————————————————————————————————————————————————————————————————————————————————————————— #

  closing_brace:
    name: punctuation.section.block.end.brace.zsh
    match: '[}]'

  # —— [function] ——————————————————————————————————————————————————————————————————————————————————————————————————— #

  function:
    patterns:
      - include: '#function_explicit'
      - include: '#function_implicit'

  # —— function_explicit ———————————————————————————————————————————————————————————————————————————————————————————— #

  function_explicit:
    name: meta.function.declaration.explicit.zsh

    # I'm using `begin` and `end` here, rather than `match`,
    #  so that I can capture each name/option as its own element, rather than having all names be captured together

    begin: |-
      (?x)
      \b(function)       # the `function` keyword can either have a space, a semicolon, `()`, or EOL after it
      (?=[ \t;]|\(\)|$)  #  nothing else is valid

    end: |-
      (?x)
      (?= \(\) | [{;] | $ )  # assert that there exists at least one of `()`, `;`, `{`, or EOL ## }
      (   \(\)  )?           # (in explicit declarations, the `()`s are optional)
      [ \t]*( ; )?
      [ \t]*([{])?           # `{` technically isn't a terminator, but everything's a lot easier if I consider it one }

    beginCaptures:
      '1': { name: storage.type.function.zsh } # `function`

    endCaptures:
      '1': { name: punctuation.definition.function.brackets.zsh  } # `()`
      '2': { name: punctuation.section.block.begin.semicolon.zsh } # `;`
      '3': { name: punctuation.section.block.begin.brace.zsh     } # `{`

    patterns:
      - include: '#function_options'
      - include: '#function_name'

  # —— function_options ————————————————————————————————————————————————————————————————————————————————————————————— #

  function_options:
    begin: |-
      (?x)(?<=\bfunction\b) # ideally I would do `(?<=\bfunction(?=[ \t]))`, but it all breaks for some reason if I do

    end: |-
      (?x)(?:                         # end option parsing when ...
        (?=-[^-T]|--[^ \t]|[^-T \t])  # - we're about to pass an invalid option, or something that's not an option
        |
        (?<=--)                       # - or we just passed `--`
        |
        (?=                           # - or the function declaration is about to end
          (?=\(\)|[ \t]*(?:[{;]|$))
          (?:\(\))?
          [ \t]*(?: ; )?
          [ \t]*(?:[{])?
        )
      )

    patterns:
      - include: '#function_option'

  # —— function_option —————————————————————————————————————————————————————————————————————————————————————————————— #

  function_option:
    name: constant.other.option.zsh
    match: |-
      (?x)
      (?<=[ \t])
      (?:-T+|(--))
      (?=[ \t])

    captures: { '1': { name: constant.other.option.end.zsh } } # `--`

  function_name:
    name: entity.name.function.zsh
    match: |-
      [^(){; \t]+

  # —— function_implicit ———————————————————————————————————————————————————————————————————————————————————————————— #

  function_implicit:
    name: meta.function.declaration.implicit.zsh
    match: |-
      (?x)
      ((?: [^(){; \t]+ [ \t]* )* )  # todo: add quoting rules
      ( \(\) )                      # (in implicit declarations, the `()`s are mandatory)
      [ \t]*( ; )?
      [ \t]*([{])?

    captures:
      '1': { name: entity.name.function.zsh                      } # `name name2 name3` ...
      '2': { name: punctuation.definition.function.brackets.zsh  } # `()`
      '3': { name: punctuation.section.block.begin.semicolon.zsh } # `;`
      '4': { name: punctuation.section.block.begin.brace.zsh     } # `{`

  # —— builtin —————————————————————————————————————————————————————————————————————————————————————————————————————— #

  builtin:
    name: support.function.builtin.zsh
    match: |-
      (?x) (?<=(?:^|;|&&|[|]{1,2})[ \t]*) echo

# ——————————————————————————————————————————————————————————————————————————————————————————————————————————————————— #
